<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>ClipVault 图标备选</title>
<style>
  :root {
    --bg: #f5f4ed;
    --card: #ffffff;
    --text: #141413;
    --text-2: #6b6a66;
    --border: #e3e1d8;
  }
  body.dark {
    --bg: #141413;
    --card: #1e1e1c;
    --text: #f5f4ed;
    --text-2: #a3a19a;
    --border: #35342f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px;
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .topbar {
    max-width: 960px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 { margin: 0; font-size: 22px; }
  .topbar p { margin: 4px 0 0; font-size: 13px; color: var(--text-2); }
  .theme-toggle {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: none;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .card {
    background-color: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .card svg { width: 96px; height: 96px; }
  .card .small { display: flex; gap: 12px; align-items: center; }
  .card .small svg { width: 32px; height: 32px; }
  .card .small svg:last-child { width: 16px; height: 16px; }
  .card h3 { margin: 0; font-size: 15px; }
  .card span { font-size: 12px; color: var(--text-2); }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>ClipVault 图标备选</h1>
      <p>每个图标展示 96px / 32px / 16px 三种尺寸，切换主题查看在明暗背景下的效果</p>
    </div>
    <button class="theme-toggle" onclick="document.body.classList.toggle('dark')">切换明暗</button>
  </div>

  <div class="grid">
    <div class="card">
      <svg viewBox="0 0 64 64"><rect x="12" y="10" width="34" height="44" rx="7" fill="#c96442" opacity="0.4"/><rect x="18" y="14" width="34" height="44" rx="7" fill="#c96442"/><rect x="27" y="9" width="16" height="8" rx="3" fill="#f5f4ed"/><rect x="26" y="26" width="18" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/><rect x="26" y="34" width="18" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/><rect x="26" y="42" width="12" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/></svg>
      <div class="small">
        <svg viewBox="0 0 64 64"><rect x="12" y="10" width="34" height="44" rx="7" fill="#c96442" opacity="0.4"/><rect x="18" y="14" width="34" height="44" rx="7" fill="#c96442"/><rect x="27" y="9" width="16" height="8" rx="3" fill="#f5f4ed"/><rect x="26" y="26" width="18" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/><rect x="26" y="34" width="18" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/><rect x="26" y="42" width="12" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/></svg>
        <svg viewBox="0 0 64 64"><rect x="12" y="10" width="34" height="44" rx="7" fill="#c96442" opacity="0.4"/><rect x="18" y="14" width="34" height="44" rx="7" fill="#c96442"/><rect x="27" y="9" width="16" height="8" rx="3" fill="#f5f4ed"/><rect x="26" y="26" width="18" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/><rect x="26" y="34" width="18" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/><rect x="26" y="42" width="12" height="3.5" rx="1.75" fill="#f5f4ed" opacity="0.85"/></svg>
      </div>
      <h3>1. 层叠剪贴板</h3>
      <span>icon-1-stacked.svg</span>
    </div>

    <div class="card">
      <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#c96442"/><circle cx="34" cy="32" r="13" fill="none" stroke="#f5f4ed" stroke-width="4"/><circle cx="34" cy="32" r="3.5" fill="#f5f4ed"/><line x1="34" y1="22" x2="34" y2="28.5" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="34" y1="35.5" x2="34" y2="42" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="24" y1="32" x2="30.5" y2="32" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="37.5" y1="32" x2="44" y2="32" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><rect x="9" y="13" width="4" height="10" rx="2" fill="#f5f4ed"/><rect x="9" y="41" width="4" height="10" rx="2" fill="#f5f4ed"/></svg>
      <div class="small">
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#c96442"/><circle cx="34" cy="32" r="13" fill="none" stroke="#f5f4ed" stroke-width="4"/><circle cx="34" cy="32" r="3.5" fill="#f5f4ed"/><line x1="34" y1="22" x2="34" y2="28.5" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="34" y1="35.5" x2="34" y2="42" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="24" y1="32" x2="30.5" y2="32" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="37.5" y1="32" x2="44" y2="32" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><rect x="9" y="13" width="4" height="10" rx="2" fill="#f5f4ed"/><rect x="9" y="41" width="4" height="10" rx="2" fill="#f5f4ed"/></svg>
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#c96442"/><circle cx="34" cy="32" r="13" fill="none" stroke="#f5f4ed" stroke-width="4"/><circle cx="34" cy="32" r="3.5" fill="#f5f4ed"/><line x1="34" y1="22" x2="34" y2="28.5" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="34" y1="35.5" x2="34" y2="42" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="24" y1="32" x2="30.5" y2="32" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><line x1="37.5" y1="32" x2="44" y2="32" stroke="#f5f4ed" stroke-width="4" stroke-linecap="round"/><rect x="9" y="13" width="4" height="10" rx="2" fill="#f5f4ed"/><rect x="9" y="41" width="4" height="10" rx="2" fill="#f5f4ed"/></svg>
      </div>
      <h3>2. 保险库拨盘</h3>
      <span>icon-2-vault.svg</span>
    </div>

    <div class="card">
      <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#f5f4ed"/><rect x="16" y="12" width="32" height="42" rx="6" fill="none" stroke="#c96442" stroke-width="4"/><rect x="25" y="8" width="14" height="9" rx="3" fill="#c96442"/><path d="M24 34 L30 40 L41 27" fill="none" stroke="#c96442" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="small">
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#f5f4ed"/><rect x="16" y="12" width="32" height="42" rx="6" fill="none" stroke="#c96442" stroke-width="4"/><rect x="25" y="8" width="14" height="9" rx="3" fill="#c96442"/><path d="M24 34 L30 40 L41 27" fill="none" stroke="#c96442" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#f5f4ed"/><rect x="16" y="12" width="32" height="42" rx="6" fill="none" stroke="#c96442" stroke-width="4"/><rect x="25" y="8" width="14" height="9" rx="3" fill="#c96442"/><path d="M24 34 L30 40 L41 27" fill="none" stroke="#c96442" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3>3. 剪贴板对勾</h3>
      <span>icon-3-clipboard-check.svg</span>
    </div>

    <div class="card">
      <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#141413"/><rect x="14" y="16" width="36" height="9" rx="4.5" fill="#c96442"/><rect x="14" y="28" width="36" height="9" rx="4.5" fill="#c96442" opacity="0.55"/><rect x="14" y="40" width="36" height="9" rx="4.5" fill="#c96442" opacity="0.3"/></svg>
      <div class="small">
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#141413"/><rect x="14" y="16" width="36" height="9" rx="4.5" fill="#c96442"/><rect x="14" y="28" width="36" height="9" rx="4.5" fill="#c96442" opacity="0.55"/><rect x="14" y="40" width="36" height="9" rx="4.5" fill="#c96442" opacity="0.3"/></svg>
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#141413"/><rect x="14" y="16" width="36" height="9" rx="4.5" fill="#c96442"/><rect x="14" y="28" width="36" height="9" rx="4.5" fill="#c96442" opacity="0.55"/><rect x="14" y="40" width="36" height="9" rx="4.5" fill="#c96442" opacity="0.3"/></svg>
      </div>
      <h3>4. 存储层</h3>
      <span>icon-4-layers.svg</span>
    </div>

    <div class="card">
      <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#c96442"/><circle cx="32" cy="27" r="9" fill="#f5f4ed"/><path d="M28 34 L26 46 a2 2 0 0 0 2 2 h8 a2 2 0 0 0 2 -2 L36 34 Z" fill="#f5f4ed"/></svg>
      <div class="small">
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#c96442"/><circle cx="32" cy="27" r="9" fill="#f5f4ed"/><path d="M28 34 L26 46 a2 2 0 0 0 2 2 h8 a2 2 0 0 0 2 -2 L36 34 Z" fill="#f5f4ed"/></svg>
        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#c96442"/><circle cx="32" cy="27" r="9" fill="#f5f4ed"/><path d="M28 34 L26 46 a2 2 0 0 0 2 2 h8 a2 2 0 0 0 2 -2 L36 34 Z" fill="#f5f4ed"/></svg>
      </div>
      <h3>5. 钥匙孔</h3>
      <span>icon-5-keyhole.svg</span>
    </div>

    <div class="card">
      <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#141413"/><path d="M44 20 a16 16 0 1 0 0 24" fill="none" stroke="#c96442" stroke-width="7" stroke-linecap="round"/><circle cx="46" cy="32" r="4" fill="#f5f4ed"/></svg>

        <svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#141413"/><path d="M44 20 a16 16 0 1 0 0 24" fill="none" stroke="#c96442" stroke-width="7" stroke-linecap="round"/><circle cx="46" cy="32" r="4" fill="#f5f4ed"/></svg>
      </div>
      <h3>6. C 字母标</h3>
      <span>icon-6-monogram.svg</span>
    </div>
  </div>
</body>
</html>
